# /etc/nginx/sites-available/chat.marinero.150197.pl
#
# Docelowa konfiguracja z certyfikatem. Skrypt `install.sh` wgrywa ją DOPIERO
# po wystawieniu certyfikatu — wcześniej stoi wersja na samym porcie 80
# (inaczej `nginx -t` nie przechodzi, bo wskazuje na nieistniejący plik,
# a wtedy certbot też nie ruszy).
#
# Czat wymaga WebSocketa (ActionCable) — bez `Upgrade`/`Connection` widżet
# łączy się, ale wiadomości nie przychodzą na żywo, tylko po odświeżeniu.

server {
    listen 80;
    server_name chat.marinero.150197.pl;

    # Odnowienie certyfikatu musi przejść po HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on` zamiast `listen ... http2` — inaczej nginx sypie
    # „protocol options redefined for 0.0.0.0:443", bo inne serwery na tym
    # VPS-ie deklarują http2 przy `listen`.
    listen 443 ssl;
    http2 on;
    server_name chat.marinero.150197.pl;

    ssl_certificate     /etc/letsencrypt/live/chat.marinero.150197.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.marinero.150197.pl/privkey.pem;

    # Zrzuty ekranu i pliki od klientów potrafią być duże.
    client_max_body_size 40M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
