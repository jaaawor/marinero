# Chatwoot — czat na stronie, odpowiedzi w jednej skrzynce (przeglądarka
# + aplikacja na telefon). Stoi obok Directusa i Medusy na tym samym VPS.
#
# Uruchomienie: patrz README.md w tym katalogu.
#
# Uwaga: `rails` i `sidekiq` to ten sam obraz — pierwszy serwuje HTTP,
# drugi przetwarza kolejkę (maile, webhooki, załączniki). Bez sidekiqa
# widżet działa, ale powiadomienia i maile nie wychodzą.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis:/data

  rails:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    # Tylko na pętli zwrotnej — z internetu wpuszcza nginx z certyfikatem.
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    env_file: .env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage:/app/storage

volumes:
  postgres:
  redis:
  storage:
