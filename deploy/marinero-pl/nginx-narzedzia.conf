# Druga kłódka na narzędzia wewnętrzne.
#
# Same strony są za logowaniem kontem z Directusa, więc nikt bez konta nic nie
# zobaczy. To jest warstwa **przed** tym logowaniem: bot skanujący adresy dostaje
# 401 i nigdy nie widzi nawet formularza, a próby zgadywania haseł do Directusa
# przez internet nie mają jak się zacząć.
#
# Sam adres (`/narzedzia-8f3a`) to nie jest zabezpieczenie — to tylko tyle, żeby
# skanery nie trafiały w niego z listy popularnych ścieżek. Zabezpieczeniem jest
# to hasło i logowanie do Directusa.
#
# Wkleić do bloku `server` dla marinero.pl w /etc/nginx/sites-available/marinero.pl,
# **przed** `location /`.

location ^~ /narzedzia-8f3a {
    auth_basic "Marinero — narzędzia";
    auth_basic_user_file /etc/nginx/narzedzia.htpasswd;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API narzędzi woła przeglądarka **już po** przejściu przez powyższe, więc leci
# z tym samym nagłówkiem Authorization. Bez tej sekcji strony ładowałyby się,
# ale każde zapytanie o dane kończyłoby się błędem.
location ^~ /api/admin/ {
    auth_basic "Marinero — narzędzia";
    auth_basic_user_file /etc/nginx/narzedzia.htpasswd;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
}
