  „502 Bad Gateway", gdy nie może się dostać do aplikacji.

  Na serwer idzie pod:
    mkdir -p /var/www/marinero-przerwa
    cp /opt/marinero-frontend/deploy/marinero-pl/przerwa.html /var/www/marinero-przerwa/

  Strona jest **samodzielna**: własne style, logo i zdjęcie wpisane wprost
  w plik (base64). Gdy aplikacja nie odpowiada, nie odda też CSS-a, logotypu
  ani żadnego zdjęcia spod `/images/…` — więc wszystko, co ma się pokazać,
  musi być w tym jednym pliku. Odnośnik do `marinero.pl/images/...` dałby tu
  pustą ramkę dokładnie wtedy, kiedy ta strona jest potrzebna.

  Zdjęcie (XO EXPLR 44) jest zmniejszone do 1200 px i zapisane z jakością 58 —
  stoi przyciemnione pod kartą, więc ostrość nie ma tu nic do roboty, a plik
  wchodzi na stronę razem z treścią i pobiera się przy każdym odświeżeniu.
-->
