# Ekran przerwy zamiast surowego „502 Bad Gateway" — do włączenia jedną linijką.
#
# Pełna konfiguracja (`nginx-marinero-pl.conf`) ma to samo w środku, ale na
# serwerze **nie da się jej przegrać na gotowo**: certbot dopisał do niej bloki
# TLS i skopiowanie pliku z repozytorium skasowałoby certyfikat. Dlatego te
# same trzy kawałki leżą tu osobno, do dołączenia:
#
#   cp /opt/marinero-frontend/deploy/marinero-pl/nginx-przerwa.conf \
#      /etc/nginx/snippets/marinero-przerwa.conf
#
# a w `/etc/nginx/sites-available/marinero.pl`, wewnątrz bloku
# `server { … server_name marinero.pl; … }` z `listen 443`, jedna linijka:
#
#   include snippets/marinero-przerwa.conf;
#
# Bloków TLS to nie rusza, a przy kolejnej zmianie wystarczy przegrać sam
# ten plik.
#
# UWAGA: w tym samym bloku zostaje dotychczasowe `location / { proxy_pass … }`.
# Stąd idzie tylko `/api/` i dwa adresy wewnętrzne.

# `error_page` **bez `proxy_intercept_errors`**: łapie wyłącznie błędy, które
# robi sam nginx (nie dostał się do aplikacji) — czyli dokładnie okno przerwy
# przy wdrożeniu. Z `proxy_intercept_errors` nginx podmieniałby także 502
# wysyłane przez samą aplikację („Medusa nie odpowiada") i panel dostawałby
# stronę HTML zamiast komunikatu.
error_page 502 503 504 /__przerwa.html;

location = /__przerwa.html {
    root /var/www/marinero-przerwa;
    try_files /przerwa.html =503;
    internal;
}

# Panel i API dostają **JSON**, nie stronę HTML: przeglądarka czeka tam na
# odpowiedź narzędzia i z HTML-a nie umie nic wyczytać („Unexpected token '<'").
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    error_page 502 503 504 = @przerwa_json;
}

location @przerwa_json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false,"dostepne":false,"blad":"Serwer właśnie się restartuje — zwykle wchodzi nowa wersja strony i trwa to kilkanaście sekund. Spróbuj za chwilę."}';
}
