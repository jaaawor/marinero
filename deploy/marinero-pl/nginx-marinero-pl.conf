# marinero.pl + www.marinero.pl → Next.js na 127.0.0.1:3000
#
# Plik idzie na VPS aplikacji (ten, na którym stoi marinero.150197.pl):
#   /etc/nginx/sites-available/marinero.pl
#   ln -s ../sites-available/marinero.pl /etc/nginx/sites-enabled/
#
# UWAGA: to jest wyłącznie serwer WWW. Poczta marinero.pl zostaje tam, gdzie
# była — rekord MX wskazuje na mail.marinero.pl i tego nie ruszamy.

server {
    listen 80;
    listen [::]:80;
    server_name marinero.pl www.marinero.pl;

    # Certbot musi mieć czym potwierdzić domenę także po przełączeniu DNS-u
    # (odnowienia co 60 dni idą tą samą ścieżką).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://marinero.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.marinero.pl;

    ssl_certificate     /etc/letsencrypt/live/marinero.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinero.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Jeden adres kanoniczny: bez „www". Inaczej wyszukiwarka widzi dwie
    # kopie każdej strony, a `hreflang` w `seo.ts` wskazuje tylko na jedną.
    return 301 https://marinero.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marinero.pl;

    ssl_certificate     /etc/letsencrypt/live/marinero.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinero.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Zdjęcia z Directusa potrafią mieć po kilkanaście MB przed przeskalowaniem,
    # a formularz oferty wysyła PDF-a — 1 MB (domyślne) odbijało to błędem 413.
    client_max_body_size 25m;

    # Kompresja odpowiedzi HTML/JSON — Next oddaje je nieskompresowane,
    # bo zakłada, że stoi za proxy.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
