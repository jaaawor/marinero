# marinero.pl + www + sklep.marinero.pl → Next.js na 127.0.0.1:3000
#
# Plik idzie na VPS aplikacji (192.109.241.27, ten sam, na którym stoi
# marinero.150197.pl):
#   /etc/nginx/sites-available/marinero.pl
#   ln -s ../sites-available/marinero.pl /etc/nginx/sites-enabled/
#
# Celowo **bez bloków TLS** — dopisze je `certbot --nginx` po przełączeniu
# DNS-u i od razu ustawi odnawianie. Ręcznie wpisany certyfikat, którego
# jeszcze nie ma, wywala `nginx -t` i nie da się przeładować konfiguracji.
#
# UWAGA: to jest wyłącznie serwer WWW. Poczta marinero.pl zostaje tam, gdzie
# była — rekord MX wskazuje na mail.marinero.pl i tego nie ruszamy.

server {
    listen 80;
    listen [::]:80;
    server_name marinero.pl;

    # Zdjęcia z Directusa potrafią mieć po kilkanaście MB przed przeskalowaniem,
    # a formularz oferty wysyła PDF-a — 1 MB (domyślne) odbijało to błędem 413.
    client_max_body_size 25m;

    # Kompresja odpowiedzi — Next oddaje je nieskompresowane, bo zakłada,
    # że stoi za proxy.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    # Ekran przerwy zamiast surowego „502 Bad Gateway".
    #
    # Wdrożenie zatrzymuje usługę na kilkanaście sekund (patrz
    # `marinero-deploy.sh`), a przez ten czas nginx nie ma z czym rozmawiać.
    # Klient widział wtedy białą stronę z napisem „502 Bad Gateway
    # nginx/1.24.0" — wygląda jak zepsuta strona, a nie jak minuta przerwy.
    #
    # Plik: /var/www/marinero-przerwa/przerwa.html (kopia w repozytorium).
    # `internal` — pod ten adres nie da się wejść wprost, tylko przez
    # `error_page`.
    error_page 502 503 504 /__przerwa.html;
    location = /__przerwa.html {
        root /var/www/marinero-przerwa;
        try_files /przerwa.html =503;
        internal;
    }

    # **Celowo BEZ `proxy_intercept_errors on`.** Bez tej dyrektywy `error_page`
    # łapie tylko błędy, które robi sam nginx (nie dostał się do aplikacji) —
    # a to jest dokładnie ten przypadek. Z nią nginx podmieniałby także
    # odpowiedzi 502 wysyłane przez samą aplikację, np. „Medusa nie odpowiada"
    # z panelu cen: panel dostałby stronę HTML zamiast komunikatu i nie miałby
    # z czego powiedzieć, co się stało.

    # Panel i API dostają **JSON**, nie stronę HTML: przeglądarka czeka tam na
    # odpowiedź narzędzia i z HTML-a nie umie nic wyczytać („Unexpected token
    # '<'"). Ten sam komunikat co w `admin-fetch.ts`, żeby brzmiało to tak samo
    # niezależnie od tego, kto go pokazał.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        error_page 502 503 504 = @przerwa_json;
    }

    location @przerwa_json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"dostepne":false,"blad":"Serwer właśnie się restartuje — zwykle wchodzi nowa wersja strony i trwa to kilkanaście sekund. Spróbuj za chwilę."}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.marinero.pl;

    # Jeden adres kanoniczny: bez „www". Inaczej wyszukiwarka widzi dwie kopie
    # każdej strony, a `hreflang` w `seo.ts` wskazuje tylko na jedną.
    #
    # `$scheme`, nie sztywne `https://` — zanim certbot wystawi certyfikat,
    # sztywny adres HTTPS odsyłałby na stronę, której jeszcze nie ma.
    return 301 $scheme://marinero.pl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sklep.marinero.pl;

    # Stary sklep nie przekierowuje się hurtem na `/sklep` — 371 produktów ma
    # w Medusie ten sam uchwyt co w WooCommerce, więc każdy trafia na swoją
    # kartę. Robi to aplikacja (`src/lib/stary-sklep.ts` + `next.config.ts`,
    # warunek `has: host`), dlatego tu tylko podajemy jej ruch dalej.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
