# Zdjęcia produktów prosto z dysku, z pominięciem Node'a.
#
# Do wklejenia w blok `server { … server_name commerce.marinero.150197.pl; … }`
# w pliku nginxa tej domeny, **przed** `location /`. Ścieżkę w `alias` trzeba
# najpierw potwierdzić na serwerze:
#
#   find /opt/marinero-commerce -maxdepth 5 -type d -name static -not -path '*/node_modules/*'
#
# Powód: w logu Medusy prawie każdy wiersz to `GET /static/…jpg` od robota
# Meta (`meta-externalagent`), po kilkadziesiąt na sekundę, z odsyłaczem
# `https://marinero.pl/`. Każdy taki plik szedł **przez proces Node'a**, który
# obsługuje też całe Store API — a to ten sam proces, który padał na limicie
# sterty. Wydawanie plików statycznych to jedyna rzecz, którą nginx robi lepiej
# od czegokolwiek innego i przy okazji nie zajmuje tym Medusy.
#
# Nagłówek `expires` jest tu ważniejszy, niż wygląda: bez niego ten sam robot
# pobiera to samo zdjęcie przy każdym przejściu.
location /static/ {
    alias /opt/marinero-commerce/app/apps/backend/static/;   # ← POTWIERDZIĆ ścieżkę

    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;

    # Gdy pliku nie ma na dysku, pytamy Medusę — na wypadek, gdyby dostawca
    # plików kiedyś przestał być lokalny. Lepiej wolno niż 404 na zdjęciu
    # produktu, które w Merchant Center kończy się odrzuceniem oferty.
    try_files $uri @medusa;
}

location @medusa {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
