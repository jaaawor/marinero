# Dorzutka do usługi Medusy — /etc/systemd/system/marinero-commerce.service.d/pamiec.conf
#
#   mkdir -p /etc/systemd/system/marinero-commerce.service.d
#   cp /opt/marinero-frontend/deploy/medusa/pamiec/marinero-commerce-pamiec.conf \
#      /etc/systemd/system/marinero-commerce.service.d/pamiec.conf
#   systemctl daemon-reload && systemctl restart marinero-commerce
#
# Sprawdzenie, że weszło:
#   systemctl show marinero-commerce -p Environment -p Restart
#
# **To jest podpórka, nie lekarstwo.** Medusa padała co 20–40 minut na
# `FATAL ERROR: Ineffective mark-compacts near heap limit — JavaScript heap out
# of memory`, czyli na **własnym limicie sterty V8**, a nie na braku pamięci
# w maszynie (`grep -c "Out of memory" /var/log/kern.log` dawało zero, a `free -h`
# pokazywał kilka wolnych gigabajtów). Wyższy limit oddala moment przepełnienia,
# ale go nie usuwa — właściwa robota to zdjąć Medusie ruch, który ją zapycha
# (patrz `deploy/medusa/pamiec/README.md`).
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=3072

# Restart po padzie. Usługa i tak wstawała sama, ale bez tego wpisu zależy to od
# ustawienia w głównym pliku — a to jest jedyna rzecz, która sprawiała, że sklep
# wracał po dziesięciu sekundach zamiast leżeć do rana.
Restart=always
RestartSec=5
